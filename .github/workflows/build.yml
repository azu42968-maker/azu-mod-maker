name: Build ejecutables

on:
  workflow_dispatch:        # boton "Run workflow" en GitHub
  push:
    tags: ["v*"]            # al subir un tag v1.0.0 tambien crea el Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libnss3 libasound2

      - name: Dependencias Python (Linux)
        if: runner.os == 'Linux'
        run: pip install "pywebview[qt]" xmltodict pillow pyinstaller

      - name: Dependencias Python (Windows)
        if: runner.os == 'Windows'
        run: pip install pywebview xmltodict pillow pyinstaller

      - name: Dependencias Python (macOS)
        if: runner.os == 'macOS'
        run: pip install pywebview xmltodict pillow pyinstaller

      - name: Construir
        run: python build_exe.py

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: Ejecutables/*

  # Junta Linux, Windows y macOS en UN solo zip
  package:
    needs: build
    if: ${{ !cancelled() }}      # empaqueta aunque un build falle, con lo que haya
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: Ejecutables
          merge-multiple: true

      - name: Crear zip con los tres
        run: |
          ls -la Ejecutables
          chmod +x Ejecutables/AzuModificationLin || true
          cd Ejecutables
          zip -r ../AzuModification-Todos.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: AzuModification-Todos
          path: AzuModification-Todos.zip

      - name: Publicar Release (solo con tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AzuModification-Todos.zip
            Ejecutables/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
